.btn.big{padding:18px 34px;font-size:13px}

.fb.sh{color:var(--yl)}

.ans b{font-size:10px;color:var(--mu)}

@keyframes chp{from{opacity:0;transform:scale(.2) rotate(-14deg)}to{opacity:1;transform:none}}
.steps{list-style:none;padding:0;margin:14px 0 0;counter-reset:s}

.steps li::before{content:counter(s);display:inline-block;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;margin-right:10px;border-radius:50%;background:var(--cy);color:var(--bg);font:800 12px 'JetBrains Mono',monospace}
@keyframes sl{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.take{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(92,255,161,.1);border:2px dashed var(--gr);color:var(--gr);font-weight:700;line-height:1.6;animation:in .6s ease 1.5s both}
.take b{display:block;font-size:9px;margin-bottom:8px}
.take code{color:var(--gr)}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,79,154,.5),transparent 65%);animation:fla .7s ease-out forwards;z-index:50}
@keyframes fla{from{opacity:1}to{opacity:0}}
.banner{position:fixed;left:50%;top:32%;font:clamp(14px,3.6vw,30px) 'Press Start 2P',monospace;color:var(--yl);text-shadow:0 0 18px currentColor,3px 3px 0 var(--pk);white-space:nowrap;animation:ban 1.3s ease forwards;z-index:60;pointer-events:none}
@keyframes ban{0%{opacity:0;transform:translate(-50%,0) scale(.2) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(-3deg)}70%{opacity:1;transform:translate(-50%,0) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-54px) scale(1)}}
.sp{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:55;animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.2);opacity:0}}
input.b.rv2{color:var(--pk);border-color:var(--pk);background:rgba(255,79,154,.14);animation:rvp .6s}
@keyframes rvp{from{box-shadow:0 0 0 0 rgba(255,79,154,.9)}to{box-shadow:0 0 0 16px rgba(255,79,154,0)}}
@media (max-width:640px){.ctrl{grid-template-columns:1fr 1fr}.btn.show{grid-column:1/-1;order:-1;width:100%}.ctrl .btn{width:100%}}
</style>

<script>
const WORLDS=["THE WHILE LOOP","COUNT & ADD UP","DO-WHILE","LOOP PATTERNS","BOSS STAGE"];
const Q=[
{w:0,t:"A *while* loop checks its condition first. If the condition is true, the body runs, and then the condition is checked again.",c:"int i = 1;\n__0__ (i <= 3) {\n    printf(\"%d \", i);\n    i++;\n}",a:[["while"]],h:"The loop keyword that tests BEFORE running the body."},
{w:0,t:"The condition goes inside *parentheses*, and the body of the loop goes between curly braces.",c:"int i = 0;\nwhile __0__i < 5__1__ {\n    i++;\n}",a:[["("],[")"]],h:"The same round brackets you use with if."},
{w:0,t:"A while loop keeps going until its condition turns *false*. Follow the variable pass by pass.",c:"int count = 0;\nwhile (count < 4) {\n    count++;\n}\nprintf(\"%d\", count);   // prints __0__",a:[["4"]],h:"The loop stops the moment count is no longer less than 4."},
{w:0,t:"Something inside the loop must change the condition. If nothing does, you get an *infinite loop* that never ends.",c:"int i = 1;\nwhile (i <= 5) {\n    printf(\"%d\\n\", i);\n    __0__;\n}",a:[["i++","++i","i++;","++i;","i+=1","i+=1;","i=i+1","i=i+1;"]],h:"Add 1 to i on every pass."},
{w:1,t:"The accumulator pattern: start a *total* at 0, then add each value to it inside the loop.",c:"int sum = 0, i = 1;\nwhile (i <= 5) {\n    sum __0__ i;\n    i++;\n}\n// sum ends up as 15",a:[["+="]],h:"A shortcut that means sum = sum + i."},
{w:1,t:"To count down, start high and keep going while the value is *greater than* the limit. Subtract on every pass.",c:"int t = 3;\nwhile (t __0__ 0) {\n    printf(\"%d \", t);\n    t--;\n}\nprintf(\"Go!\");   // 3 2 1 Go!",a:[[">"]],h:"Stop as soon as t reaches 0, so 0 itself must not pass."},
{w:1,t:"A loop can move by any *step*, not just 1. The step is the number you add each pass.",c:"int i = 2;\nwhile (i <= 10) {\n    printf(\"%d \", i);\n    i = i + __0__;\n}\n// prints 2 4 6 8 10",a:[["2"]],h:"Look at the gap between 2, 4, 6, 8."},
{w:1,t:"To run exactly n times when counting from 0, keep going while i is *less than* n.",c:"int n, i = 0;\nscanf(\"%d\", &n);\nwhile (i __0__ n) {\n    printf(\"Hello\\n\");\n    i++;\n}\n// prints Hello n times",a:[["<"]],h:"i starts at 0, so it must stay below n, not reach it."},
{w:2,t:"A *do-while* loop runs the body first and checks the condition afterwards, so it always runs at least once.",c:"int x = 10;\n__0__ {\n    printf(\"Hi\\n\");\n} while (x < 5);",a:[["do"]],h:"A two-letter keyword that goes BEFORE the opening brace."},
{w:2,t:"A do-while loop is the only loop that ends with a *semicolon* after its condition.",c:"int k = 0;\ndo {\n    k++;\n} while (k < 3)__0__\nprintf(\"%d\", k);",a:[[";"]],h:"The same character that ends most C statements."},
{w:2,t:"Even when the condition is false from the very start, a do-while body still runs *once*.",c:"int x = 10;\ndo {\n    x++;\n} while (x < 5);\nprintf(\"%d\", x);   // prints __0__",a:[["11"]],h:"x++ runs one time before the condition is ever checked."},
{w:2,t:"Menus and input checks are perfect for do-while: *ask first*, then check whether you need to ask again.",c:"int choice;\ndo {\n    printf(\"Enter 1-3: \");\n    scanf(\"%d\", &choice);\n} while (choice __0__ 1 || choice __1__ 3);",a:[["<"],[">"]],h:"Repeat when the choice is outside the range: below 1 or above 3."},
{w:3,t:"A while loop may run *zero times* if its condition is false the first time it is checked.",c:"int n = 0;\nwhile (n > 0) {\n    printf(\"A\");\n}\nprintf(\"B\");   // prints __0__",a:[["B"]],h:"Is 0 greater than 0? Then the body never runs."},
{w:3,t:"A *sentinel* is a special value, such as -1, that tells the loop to stop reading input.",c:"int num, total = 0;\nscanf(\"%d\", &num);\nwhile (num __0__ -1) {\n    total += num;\n    scanf(\"%d\", &num);\n}",a:[["!="]],h:"Keep going while num is NOT the stop value."},
{w:3,t:"The *remainder* operator with 10 gives the last digit, and *integer division* by 10 chops that digit off. Together they take a number apart.",c:"int n = 472, sum = 0;\nwhile (n > 0) {\n    sum += n __0__ 10;   // last digit\n    n = n __1__ 10;      // remove last digit\n}",a:[["%"],["/"]],h:"One is the modulo sign, the other is plain division."},
{w:3,t:"*break* jumps out of the nearest loop immediately, even when the condition is still true. while (1) is a deliberate endless loop.",c:"int i = 1;\nwhile (1) {\n    if (i > 3) {\n        __0__;\n    }\n    printf(\"%d \", i);\n    i++;\n}",a:[["break"]],h:"The statement that leaves a loop early."},
{w:4,t:"A running *product* must start at 1, not 0, because anything multiplied by 0 stays 0.",c:"int n = 4, fact = 1, i = 1;\nwhile (i <= n) {\n    fact __0__ i;\n    i++;\n}\n// fact ends up as 24",a:[["*="]],h:"Like += but for multiplying."},
{w:4,t:"Trace it: write the variable’s value after every pass. The condition is checked *before* each pass.",c:"int i = 1;\nwhile (i < 10) {\n    i = i * 2;\n}\nprintf(\"%d\", i);   // prints __0__",a:[["16"]],h:"The values go 1, 2, 4, 8, then 16. Does 16 pass i < 10?"},
{w:4,t:"Pick the condition that makes the loop run the exact number of times you want. Work *backwards* from the answer.",c:"int n = 3, count = 0;\ndo {\n    count++;\n    n--;\n} while (n __0__ 0);\nprintf(\"%d\", count);   // prints 3",a:[[">","!="]],h:"Keep repeating until n reaches 0."},
{w:4,t:"Final boss: a *do-while* is great for counting digits, because the number 0 still has one digit.",c:"int n = 12345, digits = 0;\n__0__ {\n    digits++;\n    n = n / 10;\n} while (n __1__ 0);\nprintf(\"%d\", __2__);   // prints 5",a:[["do"],[">","!="],["digits"]],h:"Each pass removes one digit. Print the counter you kept."}
];
const X=[
{x:"`while` is the loop keyword that checks the condition BEFORE running the body. As long as the condition is true, the body repeats. As soon as it is false, the loop ends.",s:["`i = 1`: is `1 <= 3`? Yes, print 1, then `i++` makes it 2","`i = 2`: 2 <= 3 is true, print 2, then i becomes 3","`i = 3`: 3 <= 3 is true, print 3, then i becomes 4","`i = 4`: 4 <= 3 is false, so the loop ends. Output: 1 2 3"],k:"`while (condition) { body }` tests first, then runs the body."},
{x:"In C, the condition of a `while` always goes inside round brackets, and the body goes in curly braces. Leaving out the round brackets is a syntax error.",s:["`while (i < 5) {` means: keep going while i is less than 5","The opening bracket `(` comes right after the word `while`","The closing bracket `)` comes right after the condition","Then the curly brace `{` opens the body"],k:"The condition of a while loop always sits inside `( )`."},
{x:"`count` starts at 0 and the body adds 1 each pass. The loop keeps going while `count < 4` is true, so it stops the moment `count` becomes 4.",s:["`count = 0`: 0 < 4 is true, count becomes 1","`count = 1`: true, count becomes 2","`count = 2`: true, count becomes 3","`count = 3`: true, count becomes 4","`count = 4`: 4 < 4 is false, the loop ends. Print 4"],k:"The loop ends on the first value that makes the condition false."},
{x:"The loop only ends when the condition turns false, so something inside the body must move the counter toward that. Here `i` has to grow, so we add 1 each pass with `i++`. Without it, `i` stays 1 forever and the loop never stops.",s:["`i = 1`: print 1, then `i++` makes it 2","`i = 2` up to `i = 5`: each one prints and then grows","`i = 6`: 6 <= 5 is false, so the loop ends","Without `i++`, i would stay 1 and print 1 forever"],k:"Every while loop needs a line inside that changes its condition, or it becomes an infinite loop."},
{x:"An accumulator is a variable that collects a running total. It starts at 0 before the loop. Each pass, `sum += i` adds the current `i` to it. The operator `+=` is a shortcut for `sum = sum + i`.",s:["Start: `sum = 0` and `i = 1`","Pass 1: sum = 0 + 1 = 1","Pass 2: sum = 1 + 2 = 3","Pass 3: sum = 3 + 3 = 6","Pass 4: sum = 6 + 4 = 10","Pass 5: sum = 10 + 5 = 15, then i becomes 6 and the loop ends"],k:"`sum += i` adds i to the total. Always set the total to 0 first."},
{x:"To count down, the counter starts high and decreases with `t--`. The condition `t > 0` keeps going while `t` is above zero, so 3, 2 and 1 print and 0 does not. After the loop, `printf` prints Go!.",s:["`t = 3`: 3 > 0, print 3, then t becomes 2","`t = 2`: print 2, then t becomes 1","`t = 1`: print 1, then t becomes 0","`t = 0`: 0 > 0 is false, the loop ends","Go! is printed once, after the loop"],k:"Count down with `>` (or `>=`) and `t--`."},
{x:"The counter can change by any amount, not just 1. We want 2, 4, 6, 8, 10, so each pass adds 2. If we added 1, we would print every number.",s:["`i = 2`: print 2, then i = 2 + 2 = 4","`i = 4`: print 4, then i becomes 6","`i = 6`: print 6, then i becomes 8","`i = 8`: print 8, then i becomes 10","`i = 10`: 10 <= 10 is true, print 10, then i becomes 12","`i = 12`: 12 <= 10 is false, stop"],k:"The step is the amount you add (or subtract) each pass."},
{x:"`i` starts at 0, so the passes use the values 0, 1, 2, up to n - 1. That is exactly n passes. If we used `i <= n`, the loop would run one time too many.",s:["Suppose the user types `n = 3`","`i = 0`: 0 < 3 is true, print Hello, i becomes 1","`i = 1`: print Hello, i becomes 2","`i = 2`: print Hello, i becomes 3","`i = 3`: 3 < 3 is false, stop. Hello was printed 3 times"],k:"Start at 0 and use `i < n` to repeat exactly n times."},
{x:"A `do-while` loop starts with the keyword `do` before the curly braces, and it checks its condition at the END. That means the body runs before any test. Here `x < 5` is false from the start, but Hi is still printed once.",s:["The word `do` opens the loop, right before the curly brace","The body runs first, so Hi is printed","Then `while (x < 5)` is checked: 10 < 5 is false","The loop ends. Hi was printed exactly once"],k:"Syntax: `do { body } while (condition);`"},
{x:"A `do-while` loop is the one loop that needs a semicolon after its condition. Without it the compiler reports a syntax error. A normal `while` loop does not have a semicolon after its condition.",s:["`k = 0`: the body runs, k becomes 1","Check: 1 < 3 is true, so the body runs again and k becomes 2","Check: 2 < 3 is true, so the body runs again and k becomes 3","Check: 3 < 3 is false, so the loop ends. The `;` finishes the statement. Then 3 is printed"],k:"`do { ... } while (condition);` always ends with a semicolon."},
{x:"The body of a do-while always runs once before the first check. `x++` runs one time and makes `x` equal 11. Then `x < 5` is false, so the loop ends. A plain `while` would have skipped the body and printed 10.",s:["Start: `x = 10`","The body runs first: `x++` makes x = 11","The condition `11 < 5` is false, so the loop ends","Print 11"],k:"A do-while body runs at least once, even when the condition is false from the start."},
{x:"The program must ask again whenever the choice is invalid. A choice is invalid when it is below 1 OR above 3, so the repeat condition is `choice < 1 || choice > 3`. A do-while fits perfectly, because you must ask before you can check.",s:["The user types 5: `5 < 1` is false but `5 > 3` is true, so it asks again","The user types 0: `0 < 1` is true, so it asks again","The user types 2: both parts are false, so the loop ends"],k:"Repeat while the input is outside the valid range."},
{x:"A `while` loop checks first. Here the condition `n > 0` is `0 > 0`, which is false, so the body is skipped completely and A is never printed. The program carries on after the loop and prints B.",s:["`n = 0`","Check: `0 > 0` is false","The loop body is skipped entirely, so no A is printed","The line after the loop runs and prints B"],k:"A while loop can run zero times. A do-while cannot."},
{x:"A sentinel is a special value the user types to say they are done. We keep going while the number is NOT the sentinel, so the condition uses `!=`. We read the first number before the loop, and read the next one at the end of each pass.",s:["Read the first number. If it is -1, the loop never starts","Otherwise add it to `total`, then read the next number","The loop checks the new number. When the user types -1, `-1 != -1` is false","The loop ends and the -1 is never added to the total"],k:"Sentinel loop: read first, loop while `!=` the sentinel, read again at the bottom."},
{x:"To take a number apart digit by digit: `n % 10` gives the last digit (the remainder after dividing by 10), and `n / 10` removes it, because integer division drops the remainder. Repeat until `n` becomes 0.",s:["`n = 472`: last digit 472 % 10 = 2, sum = 2, then n = 472 / 10 = 47","`n = 47`: last digit 7, sum = 9, then n becomes 4","`n = 4`: last digit 4, sum = 13, then n becomes 0","`n = 0`: 0 > 0 is false, stop. The digit sum is 13"],k:"`% 10` gets the last digit and `/ 10` removes it."},
{x:"`while (1)` is a loop whose condition is always true, so it would run forever. `break` is the emergency exit. When `i` becomes greater than 3, `break` jumps out of the loop immediately.",s:["`i = 1`: the if is false, print 1, then i becomes 2","`i = 2`: print 2, then i becomes 3","`i = 3`: print 3, then i becomes 4","`i = 4`: `4 > 3` is true, so `break` leaves the loop. Output: 1 2 3"],k:"`break` exits the nearest loop immediately."},
{x:"A factorial multiplies 1 times 2 times 3 times 4. The running product must start at 1, because starting at 0 would keep it at 0 forever. `fact *= i` is a shortcut for `fact = fact * i`.",s:["Start: `fact = 1`","`i = 1`: fact = 1 * 1 = 1","`i = 2`: fact = 1 * 2 = 2","`i = 3`: fact = 2 * 3 = 6","`i = 4`: fact = 6 * 4 = 24, then i becomes 5 and the loop ends"],k:"A running total starts at 0. A running product starts at 1."},
{x:"The condition is checked before every pass, and `i` doubles each time. Trace the values: 1, 2, 4, 8, 16. The loop continues while `i < 10`, and 16 is the first value that is not less than 10.",s:["`i = 1`: 1 < 10 is true, so i becomes 2","`i = 2`: 2 < 10 is true, so i becomes 4","`i = 4`: 4 < 10 is true, so i becomes 8","`i = 8`: 8 < 10 is true, so i becomes 16","`i = 16`: 16 < 10 is false, stop. Print 16"],k:"Trace on paper: write the variable's value after every pass."},
{x:"This do-while runs the body first, then checks. We want exactly 3 passes. `n` starts at 3 and goes down by 1 each pass, so the loop should repeat while `n` is still above 0.",s:["Pass 1: count = 1, n = 2. Check 2 > 0, repeat","Pass 2: count = 2, n = 1. Check 1 > 0, repeat","Pass 3: count = 3, n = 0. Check 0 > 0 is false, stop","Print 3"],k:"Work backwards: decide how many passes you want, then pick the condition."},
{x:"A `do-while` is perfect for counting digits, because even the number 0 has one digit, so the body must run at least once. Each pass counts one digit and chops off the last one with `n / 10`. Repeat while `n` is still above 0, then print the counter.",s:["`n = 12345`: digits = 1, then n becomes 1234","`n = 1234`: digits = 2, then n becomes 123","`n = 123`: digits = 3, then n becomes 12","`n = 12`: digits = 4, then n becomes 1","`n = 1`: digits = 5, then n becomes 0","`n = 0`: 0 > 0 is false, stop. Print `digits`, which is 5"],k:"Use a do-while when the body must run at least once, such as counting digits."}
];
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nz=s=>s.replace(/\s+/g,'');
const mk=t=>esc(t).replace(/\*(.+?)\*/g,(m,w)=>'<span class="mk" data-w="'+w+'">???</span>');
const fm=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>');
let S={i:0,score:0,res:[],t0:0},st={},tm=[];
const later=(f,ms)=>{tm.push(setTimeout(f,ms))};
function show(h){tm.forEach(clearTimeout);tm=[];app.className='';app.innerHTML=h;void app.offsetWidth;app.className='enter';window.scrollTo(0,0)}
function burst(x,y,cols,n){for(let k=0;k<n;k++){const s=document.createElement('i');s.className='sp';const a=Math.random()*6.28,d=60+Math.random()*120;s.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[k%cols.length]+';--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
function banner(t,col){const b=document.createElement('div');b.className='banner';b.textContent=t;if(col)b.style.color=col;document.body.appendChild(b);setTimeout(()=>b.remove(),1300)}
function flash(){const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),750)}
function title(){
 show('<div class="hero"><span class="px pre">SIR EIJAY’S</span><h1 class="px logo">LOOP<em>ARCADE</em></h1><p class="px" style="font-size:clamp(9px,2vw,13px);color:var(--cy);margin:-10px 0 22px;letter-spacing:.12em">C PROGRAMMING EDITION</p>'
 +'<p class="sub">Review mode. Fill in the missing code, and press SHOW ANSWER any time you want the full explanation.</p>'
 +'<div class="rules"><span>+10 first try</span><span>−2 per wrong try</span><span>−3 for a hint</span><span>Show Answer = 0 pts</span></div><button class="btn go big" id="st">START ▶</button></div>');
 const b=document.getElementById('st');b.focus();b.onclick=()=>{S.t0=Date.now();world()};
}
function world(){
 const w=Q[S.i].w;
 show('<div class="hero"><p class="px wl">WORLD '+(w+1)+' OF 5</p><h1 class="px wt">'+esc(WORLDS[w])+'</h1><p class="sub">'+(w==4?'Last four questions. This is the boss stage.':'Four questions. Read, think, type.')+'</p><button class="btn go" id="go">GO ▶</button></div>');
 document.getElementById('go').onclick=question;
}
function hud(){
 let s='';for(let k=0;k<Q.length;k++)s+='<i class="'+(k<S.i?'d':k==S.i?'c':'')+'"></i>';
 return '<div class="hud px"><span>W'+(Q[S.i].w+1)+' · '+esc(WORLDS[Q[S.i].w])+'</span><span>SCORE <b id="sc">'+S.score+'</b></span></div><div class="seg">'+s+'</div>';
}
function question(){
 const q=Q[S.i];st={wrong:0,hint:false,done:false,busy:false};
 const code=q.c.split('\n').map(l=>{
  let h=esc(l).replace(/(\/\/.*)$/,'<span class="cm">$1</span>').replace(/[\[\]]/g,m=>'<span class="br">'+m+'</span>');
  h=h.replace(/__(\d)__/g,(m,k)=>'<input class="b" data-k="'+k+'" style="--w:'+Math.max(2,...q.a[k].map(x=>x.length))+'" autocomplete="off" autocapitalize="off" spellcheck="false">');
  return '<div>'+h+'</div>';}).join('');
 show(hud()+'<div class="card learn"><span class="tag">LEARN</span><p>'+mk(q.t)+'</p></div><div class="card code">'+code+'</div>'
 +'<div class="hint" id="hn">💡 '+esc(q.h)+'</div>'
 +'<div class="ctrl" id="ct"><button class="btn dim l" id="hb">HINT (−3)</button><button class="btn show" id="sa">SHOW ANSWER</button><button class="btn go r" id="ck">CHECK ▶</button></div>'
 +'<div class="fbr"><span class="fb" id="fb"></span></div><div id="xp"></div><div class="nxr" id="nr"></div>');
 const ins=[...app.querySelectorAll('input.b')];ins[0].focus();
 ins.forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')check()});
 document.getElementById('ck').onclick=check;
 document.getElementById('sa').onclick=showAns;
 document.getElementById('hb').onclick=()=>{st.hint=true;document.getElementById('hn').classList.add('on');const b=document.getElementById('hb');b.disabled=true;b.textContent='HINT USED'};
}
function check(){
 if(st.done||st.busy)return;
 const q=Q[S.i],ins=[...app.querySelectorAll('input.b')];let all=true;
 ins.forEach(i=>{const ok=q.a[+i.dataset.k].map(nz).includes(nz(i.value));i.classList.remove('bad');void i.offsetWidth;i.classList.toggle('ok',ok);if(!ok){all=false;i.classList.add('bad')}});
 const fb=document.getElementById('fb');
 if(all){finish(Math.max(2,10-2*st.wrong-(st.hint?3:0)),'ok')}
 else{st.wrong++;fb.className='fb no';fb.textContent=st.wrong>=2?'Still stuck? Press SHOW ANSWER for the full explanation.':'Not quite. Check the red blanks and try again.'}
}
function showAns(){
 if(st.done||st.busy)return;st.busy=true;
 const q=Q[S.i],ins=[...app.querySelectorAll('input.b')];
 ['ck','hb','sa'].forEach(id=>document.getElementById(id).disabled=true);
 flash();banner('ANSWER UNLOCKED!');
 const r=document.getElementById('sa').getBoundingClientRect();
 burst(r.left+r.width/2,r.top+r.height/2,['#FF4F9A','#FFD93D','#2EE6D6'],26);
 let mx=0;
 ins.forEach((inp,j)=>{
  const t=q.a[+inp.dataset.k][0];inp.value='';inp.classList.remove('ok','bad');inp.classList.add('rv2');mx=Math.max(mx,t.length);
  for(let c=1;c<=t.length;c++)later(()=>{inp.value=t.slice(0,c)},500+j*250+c*90);
 });
 later(()=>finish(0,'shown'),500+(ins.length-1)*250+mx*90+450);
}
function finish(pts,mode){
 const shown=mode=='shown',q=Q[S.i],x=X[S.i];
 st.done=true;S.score+=pts;S.res[S.i]={pts,wrong:st.wrong,hint:st.hint,shown};
 document.getElementById('sc').textContent=S.score;
 app.querySelectorAll('input.b').forEach(i=>{i.disabled=true;if(!shown){i.classList.add('ok')}});
 app.querySelectorAll('.mk').forEach(m=>{m.textContent=m.dataset.w;m.classList.add('rv')});
 document.getElementById('ct').classList.add('gone');
 const fb=document.getElementById('fb');fb.className='fb '+(shown?'sh':'ok');
 fb.textContent=shown?'Study the explanation, then move on.':'Correct! +'+pts;
 if(!shown){banner('+'+pts+' NICE!','#5CFFA1');burst(innerWidth/2,innerHeight*.4,['#5CFFA1','#FFD93D','#2EE6D6'],22)}
 const chips=q.a.map((al,k)=>'<span class="chip" style="--d:'+(k*140+300)+'ms">'+esc(al[0])+'</span>').join('');
 const steps=x.s.map((t,k)=>'<li style="--d:'+(700+k*230)+'ms">'+fm(t)+'</li>').join('');
 document.getElementById('xp').innerHTML='<div class="xcard"><span class="tag gold">'+(shown?'ANSWER UNLOCKED':'WHY IT WORKS')+'</span><div class="ans"><b class="px">ANSWER</b>'+chips+'</div><p>'+fm(x.x)+'</p><ol class="steps">'+steps+'</ol><div class="take"><b class="px">REMEMBER</b>'+fm(x.k)+'</div></div>';
 const nb=document.createElement('button');nb.className='btn hot big';nb.id='nx';nb.textContent=S.i==Q.length-1?'FINISH ▶':'NEXT ▶';nb.onclick=next;
 document.getElementById('nr').appendChild(nb);
 later(()=>document.getElementById('xp').scrollIntoView({behavior:'smooth',block:'center'}),350);
}
function next(){S.i++;if(S.i>=Q.length)return end();Q[S.i].w!=Q[S.i-1].w?world():question()}
document.addEventListener('keydown',e=>{const n=document.getElementById('nx');if(e.key=='Enter'&&n&&document.activeElement!==n)n.click()});
function end(){
 const max=Q.length*10,pc=S.score/max*100,t=Math.round((Date.now()-S.t0)/1000);
 const R=pc>=90?['S','LOOP MASTER','#FFD93D']:pc>=75?['A','CODE WIZARD','#2EE6D6']:pc>=60?['B','RISING CODER','#5CFFA1']:pc>=40?['C','GETTING THERE','#FF9F4F']:['D','KEEP REVIEWING','#FF4F9A'];
 const first=S.res.filter(r=>!r.shown&&!r.wrong&&!r.hint).length,hints=S.res.filter(r=>r.hint).length,shown=S.res.filter(r=>r.shown).length;
 const wb=WORLDS.map((n,w)=>{const p=S.res.reduce((a,r,k)=>a+(Q[k].w==w?r.pts:0),0);return '<div class="wb"><span>'+esc(n)+'</span><div><i data-w="'+p*2.5+'"></i></div><b>'+p+'/40</b></div>'}).join('');
 show('<div class="hero"><p class="px wl">REVIEW COMPLETE</p><h2 class="px" style="font-size:clamp(14px,3vw,22px);margin-bottom:18px;color:var(--cy)">STAGE CLEAR!</h2>'
 +'<div class="big"><span id="cn">0</span><small>/'+max+'</small></div><div class="rk" style="color:'+R[2]+';text-shadow:0 0 24px '+R[2]+'">'+R[0]+'</div><p class="px" style="font-size:12px;color:'+R[2]+'">'+R[1]+'</p></div>'
 +'<div class="stats"><div class="card"><b>'+first+'/'+Q.length+'</b><span>first try</span></div><div class="card"><b>'+hints+'</b><span>hints used</span></div><div class="card"><b>'+shown+'</b><span>answers shown</span></div><div class="card"><b>'+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+'</b><span>time</span></div></div>'
 +'<div class="card">'+wb+'</div><p class="shot">Short bars show the worlds worth reviewing again.</p><div style="text-align:center;margin-top:18px"><button class="btn hot big" id="pa">PLAY AGAIN ▶</button></div>');
 document.getElementById('pa').onclick=()=>{S={i:0,score:0,res:[],t0:0};title()};
 const t0=performance.now(),cn=document.getElementById('cn');
 (function f(n){const k=Math.min(1,(n-t0)/1400);cn.textContent=Math.round(S.score*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.wb i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
title();
</script>
</body>
